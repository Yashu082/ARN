<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error - Resume Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-50 to-white min-h-screen p-10 font-sans text-gray-800">
  <div class="max-w-3xl mx-auto pb-24">
    <div class="bg-white rounded-xl shadow-md p-8">
      <h1 class="text-3xl font-bold text-red-600 text-center mb-6">Error</h1>
      
      <div class="bg-red-50 border-l-4 border-red-400 p-4 rounded mb-6">
        <p class="text-gray-700">{{ message }}</p>
      </div>

      <div class="text-center mt-6">
        <a href="/" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Back
        </a>
      </div>
    </div>
  </div>

  <footer class="fixed bottom-0 left-0 right-0 border-t bg-white/80">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between text-xs text-gray-500">
      <span>Built by Yaswanth Koppanathi</span>
      <nav class="space-x-4">
        <a href="https://github.com/yaswanth-koppanathi-ai" target="_blank" rel="noopener noreferrer" class="hover:text-gray-700">GitHub</a>
        <a href="https://www.linkedin.com/in/yaswanth-koppanathi-ai/" target="_blank" rel="noopener noreferrer" class="hover:text-gray-700">LinkedIn</a>
      </nav>
    </div>
  </footer>
</body>
</html>
